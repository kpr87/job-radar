[project]
name = "job-radar"
version = "0.2.0"
description = "Daily job search: collect, filter, rank with Claude and email the best matches"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.scripts]
jobradar = "jobradar.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobradar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
